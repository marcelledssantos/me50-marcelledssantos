{% load static %}

<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>{% block title %}Wiki{% endblock %}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'encyclopedia/styles.css' %}">
    </head>
    <body>
        <div class="container-fluid">
            <div class="row min-vh-100">
                <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar py-4">
                    <div class="sidebar-sticky">
                        <h1 class="display-6 mb-4">Wiki</h1>
                        <form action="{% url 'search' %}" method="get" class="mb-3">
                            <input type="text" name="q" class="form-control" placeholder="Search Encyclopedia">
                        </form>
                        <ul class="nav flex-column">
                            <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Home</a></li>
                            <li class="nav-item"><a class="nav-link" href="{% url 'create' %}">Create New Page</a></li>
                            <li class="nav-item"><a class="nav-link" href="{% url 'random' %}">Random Page</a></li>
                        </ul>
                    </div>
                </nav>
                <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-success" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                    {% block body %}{% endblock %}
                </main>
            </div>
        </div>

    </body>
</html>
