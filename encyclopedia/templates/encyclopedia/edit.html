{% extends "encyclopedia/layout.html" %}
{% load static %}

{% block title %}
    Edit Entry
{% endblock %}

{% block body %}
<div class="container">
    <h1>Edit Entry: {{ title }}</h1>
    <form action="{% url 'edit' title %}" method="post" class="mt-4">
        {% csrf_token %}
        <div class="mb-3">
            <label for="content" class="form-label">Content (Markdown):</label>
            <textarea name="content" id="content" rows="10" class="form-control" required>{{ content }}</textarea>
        </div>
        <button type="submit" class="btn btn-secondary">Save</button>
        <a href="{% url 'entry' title %}" class="btn btn-link">Cancel</a>
    </form>
</div>
{% endblock %}
