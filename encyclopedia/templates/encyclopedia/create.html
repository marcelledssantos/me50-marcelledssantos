<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Create New Entry</title>
    </head>
    <body>
        {% extends "encyclopedia/layout.html" %}
        {% load static %}

        {% block title %}
            Create New Entry
        {% endblock %}

        {% block body %}
        <div class="container">
            <h1>Create New Entry</h1>
            <form action="{% url 'create' %}" method="post" class="mt-4">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="title" class="form-label">Title:</label>
                    <input type="text" name="title" id="title" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="content" class="form-label">Content (Markdown):</label>
                    <textarea name="content" id="content" rows="10" class="form-control" required></textarea>
                </div>
                <button type="submit" class="btn btn-secondary">Save</button>
                <a href="{% url 'index' %}" class="btn btn-link">Cancel</a>
            </form>
        </div>
        {% endblock %}
    </body>
</html>
