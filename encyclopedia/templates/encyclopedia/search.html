{% extends "encyclopedia/layout.html" %}

{% block title %}
    Search Results
{% endblock %}

{% block body %}
<div class="container">
    <h1 class="mb-4">Search Results for "{{ query }}"</h1>
    {% if results %}
        <ul class="list-group">
            {% for entry in results %}
                <li class="list-group-item">
                    <a href="{% url 'entry' entry %}" class="nav-link d-inline">{{ entry }}</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <div class="alert alert-warning mt-3" role="alert">
            No entries found.
        </div>
    {% endif %}
</div>
{% endblock %}
